# Curated seed of open-weight model families worth holding locally
# (plan.md decision 6, Phases 19–26). This is a SEED, not a live index: it
# is dated, hand-edited, and deliberately conservative. Currency comes from
# the live feeds (catalog.trending — Hugging Face's GGUF trending list, and
# catalog.check_updates — Ollama's registry manifests). Any tag here, and
# any hf.co/<org>/<repo>[:<quant>] tag from the trending feed, is pullable
# from the Models page.
updated: 2026-09-15
note: >
  Seed list, curated by hand. Treat the Hugging Face trending feed and the
  Ollama registry as the source of truth for what is newest; treat this
  file as the source of truth for what is worth keeping. Sizes are
  approximate download sizes at the default quantization.

models:
  - name: qwen2.5
    org: Alibaba (Qwen)
    family: qwen2
    category: general
    description: Strong general model with reliable tool calling; this app's default.
    license: Apache-2.0
    capabilities: [tools]
    recommended: true
    ollama_tags:
      - {tag: "qwen2.5:7b", size: "4.7 GB"}
      - {tag: "qwen2.5:14b", size: "9.0 GB"}
      - {tag: "qwen2.5:32b", size: "20 GB"}
      - {tag: "qwen2.5:72b", size: "47 GB"}
    hf_repo: Qwen/Qwen2.5-7B-Instruct-GGUF
    notes: 3B and 72B are Qwen Research licensed; 7B/14B/32B are Apache-2.0.

  - name: qwen2.5-coder
    org: Alibaba (Qwen)
    family: qwen2
    category: coding
    description: Code-specialized Qwen 2.5; excellent local coding model.
    license: Apache-2.0
    capabilities: [tools]
    recommended: true
    ollama_tags:
      - {tag: "qwen2.5-coder:7b", size: "4.7 GB"}
      - {tag: "qwen2.5-coder:14b", size: "9.0 GB"}
      - {tag: "qwen2.5-coder:32b", size: "20 GB"}
